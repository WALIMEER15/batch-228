<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Salary Calculator</title>

    <link rel="stylesheet" href="sal.css">
</head>

<body>

<div class="container">

    <h1>Attendance & Salary Calculator</h1>

    <!-- Employee Information -->

    <div class="card">

        <div class="input-group">
            <label>Employee Name</label>
            <input type="text" id="employeeName" placeholder="Enter Employee Name">
        </div>

        <div class="input-group">
            <label>Monthly Salary (Rs)</label>
            <input type="number" id="salary" placeholder="40000">
        </div>

        <div class="input-group">
            <label>Total Month Days</label>
            <select id="monthDays">
                <option value="30">30 Days</option>
                <option value="31">31 Days</option>
            </select>
        </div>

        <div class="input-group">
            <label>Duty Hours Per Day</label>
            <input type="number" id="dutyHours" value="9">
        </div>

    </div>

    <hr>

    <h2>Attendance</h2>

    <table>

        <thead>

        <tr>
            <th>Day</th>
            <th>Time In</th>
            <th>Time Out</th>
            <th>Worked Hours</th>
        </tr>

        </thead>

        <tbody id="attendanceBody">

            <!-- JavaScript یہاں Day 1 سے Day 31 تک Rows بنائے گی -->

        </tbody>

    </table>

    <br>

    <button id="calculateBtn">
        Calculate Salary
    </button>

    <button id="resetBtn">
        Reset
    </button>

    <hr>

    <div class="result">

        <h2>Salary Summary</h2>

        <p>Employee Name :
            <span id="showName">-</span>
        </p>

        <p>Total Working Days :
            <span id="workingDays">0</span>
        </p>

        <p>Absent Days :
            <span id="absentDays">0</span>
        </p>

        <p>Total Worked Hours :
            <span id="workedHours">0</span>
        </p>

        <p>Total Worked Minutes :
            <span id="workedMinutes">0</span>
        </p>

        <p>Late Minutes :
            <span id="lateMinutes">0</span>
        </p>

        <p>Overtime Minutes :
            <span id="overtimeMinutes">0</span>
        </p>

        <p>Per Minute Salary :
            Rs <span id="perMinuteSalary">0</span>
        </p>

        <h2>
            Final Salary :
            Rs <span id="finalSalary">0</span>
        </h2>

    </div>

</div>

<script src="sal.js"></script>

</body>
</html>
